name: Deploy LMS to Production

on:
  push:
    branches:
      - "feature/homework_35.2"
      - "feature/homework_30.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: pip install flake8

      - name: Run linter (flake8)
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lms_test
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --only main

      - name: Apply migrations
        run: poetry run python manage.py migrate
        env:
          SECRET_KEY: "django-insecure-1234567890abcdef1234567890abcdef"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: lms_test
          DB_USER: lms_user
          DB_PASSWORD: lms_pass

      - name: Run tests
        run: poetry run python manage.py test
        env:
          SECRET_KEY: "django-insecure-1234567890abcdef1234567890abcdef"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: lms_test
          DB_USER: lms_user
          DB_PASSWORD: lms_pass

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t lms-backend .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key test@${{ secrets.SERVER_IP }} << 'EOF'
          cd ~/app
          git pull origin feature/homework_35.2
          docker-compose -f docker-compose.prod.yaml down
          docker-compose -f docker-compose.prod.yaml up -d --build
          EOF
