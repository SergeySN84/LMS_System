version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_/var/lib/postgresql/data/
    networks:
      - lms_net

  redis:
    image: redis:7-alpine
    networks:
      - lms_net

  backend:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - lms_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - lms_net

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - lms_net

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - lms_net

volumes:
  postgres_data:

networks:
  lms_net:
    driver: bridge
